<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Sign in · Vela</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M43 10C65 26 79 48 83 70H43Z' fill='%234C82F7'/%3E%3Cpath d='M35 28V70H17Z' fill='%23E6E8EB'/%3E%3Crect x='17' y='79' width='66' height='9' rx='4.5' fill='%23E6E8EB'/%3E%3C/svg%3E">
<style>
	:root {
		--bg: #070b14;
		--surface: rgba(255, 255, 255, 0.045);
		--surface-strong: rgba(255, 255, 255, 0.07);
		--border: rgba(255, 255, 255, 0.09);
		--border-strong: rgba(255, 255, 255, 0.16);
		--text: #e6e8eb;
		--text-dim: #9aa1ab;
		--text-faint: #6b727d;
		--brand: #4c82f7;
		--brand-bright: #6b9bff;
		--danger: #ff6b6b;
		--radius: 16px;
		--font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
	}

	* { box-sizing: border-box; }

	html, body {
		height: 100%;
		margin: 0;
	}

	body {
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 24px;
		background: var(--bg);
		color: var(--text);
		font-family: var(--font);
		-webkit-font-smoothing: antialiased;
		overflow: hidden;
	}

	/* Ambient light, behind everything. */
	body::before,
	body::after {
		content: "";
		position: fixed;
		border-radius: 50%;
		filter: blur(90px);
		pointer-events: none;
		z-index: 0;
	}

	body::before {
		width: 620px;
		height: 620px;
		top: -260px;
		left: -180px;
		background: radial-gradient(circle, rgba(76, 130, 247, 0.26), transparent 70%);
	}

	body::after {
		width: 560px;
		height: 560px;
		right: -220px;
		bottom: -240px;
		background: radial-gradient(circle, rgba(118, 90, 240, 0.2), transparent 70%);
	}

	/* The Vela constellation, drawn faintly across the backdrop. */
	.constellation {
		position: fixed;
		inset: 0;
		width: 100%;
		height: 100%;
		z-index: 0;
		pointer-events: none;
		opacity: 0.55;
	}

	.constellation line {
		stroke: rgba(154, 161, 171, 0.22);
		stroke-width: 0.35;
	}

	.constellation circle {
		fill: #e6e8eb;
		animation: twinkle 5s ease-in-out infinite;
	}

	.constellation circle:nth-of-type(2n) { animation-delay: -1.6s; }
	.constellation circle:nth-of-type(3n) { animation-delay: -3.1s; }

	@keyframes twinkle {
		0%, 100% { opacity: 0.35; }
		50% { opacity: 0.95; }
	}

	.card {
		position: relative;
		z-index: 1;
		width: 100%;
		max-width: 408px;
		padding: 40px 36px 32px;
		background: linear-gradient(180deg, var(--surface-strong), var(--surface));
		border: 1px solid var(--border);
		border-radius: var(--radius);
		box-shadow: 0 24px 70px -20px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(0, 0, 0, 0.2);
		backdrop-filter: blur(14px) saturate(140%);
		-webkit-backdrop-filter: blur(14px) saturate(140%);
		animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
	}

	@keyframes rise {
		from { opacity: 0; transform: translateY(14px); }
		to { opacity: 1; transform: none; }
	}

	.brand {
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 14px;
		margin-bottom: 30px;
	}

	.brand svg {
		width: 46px;
		height: 46px;
		filter: drop-shadow(0 4px 14px rgba(76, 130, 247, 0.45));
	}

	.brand h1 {
		margin: 0;
		font-size: 26px;
		font-weight: 600;
		letter-spacing: -0.015em;
	}

	.brand p {
		margin: -8px 0 0;
		font-size: 13px;
		color: var(--text-dim);
	}

	form { display: flex; flex-direction: column; gap: 18px; }

	.field { display: flex; flex-direction: column; gap: 7px; }

	label {
		font-size: 12.5px;
		font-weight: 500;
		color: var(--text-dim);
		letter-spacing: 0.01em;
	}

	input[type="text"],
	input[type="password"] {
		width: 100%;
		padding: 12px 14px;
		font-family: inherit;
		font-size: 14.5px;
		color: var(--text);
		background: rgba(0, 0, 0, 0.32);
		border: 1px solid var(--border-strong);
		border-radius: 10px;
		outline: none;
		transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
	}

	input::placeholder { color: var(--text-faint); }

	input[type="text"]:hover,
	input[type="password"]:hover { border-color: rgba(255, 255, 255, 0.24); }

	input[type="text"]:focus,
	input[type="password"]:focus {
		border-color: var(--brand);
		background: rgba(0, 0, 0, 0.45);
		box-shadow: 0 0 0 3.5px rgba(76, 130, 247, 0.2);
	}

	.pw-wrap { position: relative; display: flex; }

	.pw-wrap input { padding-right: 46px; }

	.pw-toggle {
		position: absolute;
		top: 50%;
		right: 6px;
		transform: translateY(-50%);
		display: grid;
		place-items: center;
		width: 34px;
		height: 34px;
		padding: 0;
		color: var(--text-faint);
		background: none;
		border: 0;
		border-radius: 8px;
		cursor: pointer;
		transition: color 0.15s ease, background 0.15s ease;
	}

	.pw-toggle:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }

	.pw-toggle:focus-visible {
		outline: 2px solid var(--brand);
		outline-offset: 1px;
		color: var(--text);
	}

	button[type="submit"] {
		margin-top: 4px;
		padding: 13px 16px;
		font-family: inherit;
		font-size: 14.5px;
		font-weight: 600;
		letter-spacing: 0.01em;
		color: #fff;
		background: linear-gradient(180deg, var(--brand-bright), var(--brand));
		border: 0;
		border-radius: 10px;
		cursor: pointer;
		transition: transform 0.14s ease, box-shadow 0.18s ease, filter 0.14s ease;
		box-shadow: 0 8px 22px -8px rgba(76, 130, 247, 0.8);
	}

	button[type="submit"]:hover { filter: brightness(1.07); box-shadow: 0 12px 28px -8px rgba(76, 130, 247, 0.9); }
	button[type="submit"]:active { transform: translateY(1px); box-shadow: 0 4px 14px -6px rgba(76, 130, 247, 0.8); }
	button[type="submit"]:focus-visible { outline: 2px solid var(--brand-bright); outline-offset: 3px; }
	button[type="submit"][disabled] { opacity: 0.6; cursor: progress; filter: none; }

	.alert {
		display: flex;
		align-items: flex-start;
		gap: 10px;
		padding: 11px 13px;
		font-size: 13px;
		line-height: 1.45;
		color: #ffc9c9;
		background: rgba(255, 107, 107, 0.1);
		border: 1px solid rgba(255, 107, 107, 0.3);
		border-radius: 10px;
		animation: shake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
	}

	.alert svg { flex: none; margin-top: 1px; }

	@keyframes shake {
		10%, 90% { transform: translateX(-1px); }
		20%, 80% { transform: translateX(2px); }
		30%, 50%, 70% { transform: translateX(-4px); }
		40%, 60% { transform: translateX(4px); }
	}

	.caps {
		display: none;
		font-size: 12px;
		color: #ffd79a;
	}

	.caps.on { display: block; }

	footer {
		margin-top: 26px;
		padding-top: 18px;
		border-top: 1px solid var(--border);
		font-size: 11.5px;
		line-height: 1.6;
		color: var(--text-faint);
		text-align: center;
	}

	footer strong { color: var(--text-dim); font-weight: 500; }

	@media (max-width: 420px) {
		.card { padding: 32px 24px 26px; }
		.brand h1 { font-size: 23px; }
	}

	@media (prefers-reduced-motion: reduce) {
		*, *::before, *::after {
			animation: none !important;
			transition: none !important;
		}
	}
</style>
</head>
<body>
	<svg class="constellation" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
		<!-- Suhail, Markeb, Regor, Alsephina and friends, loosely placed. -->
		<line x1="18" y1="30" x2="31" y2="22" />
		<line x1="31" y1="22" x2="46" y2="31" />
		<line x1="46" y1="31" x2="40" y2="48" />
		<line x1="40" y1="48" x2="22" y2="44" />
		<line x1="22" y1="44" x2="18" y2="30" />
		<line x1="46" y1="31" x2="64" y2="24" />
		<line x1="64" y1="24" x2="78" y2="36" />
		<line x1="40" y1="48" x2="58" y2="62" />
		<line x1="58" y1="62" x2="76" y2="58" />
		<line x1="58" y1="62" x2="50" y2="79" />
		<circle cx="18" cy="30" r="0.8" />
		<circle cx="31" cy="22" r="0.55" />
		<circle cx="46" cy="31" r="0.95" />
		<circle cx="40" cy="48" r="0.7" />
		<circle cx="22" cy="44" r="0.5" />
		<circle cx="64" cy="24" r="0.6" />
		<circle cx="78" cy="36" r="0.85" />
		<circle cx="58" cy="62" r="0.75" />
		<circle cx="76" cy="58" r="0.5" />
		<circle cx="50" cy="79" r="0.6" />
		<circle cx="88" cy="18" r="0.4" />
		<circle cx="11" cy="64" r="0.45" />
		<circle cx="68" cy="84" r="0.4" />
		<circle cx="90" cy="72" r="0.5" />
		<circle cx="34" cy="88" r="0.35" />
	</svg>

	<main class="card">
		<div class="brand">
			<svg viewBox="0 0 100 100" role="img" aria-label="Vela">
				<path d="M43 10C65 26 79 48 83 70H43Z" fill="#4C82F7" />
				<path d="M35 28V70H17Z" fill="#E6E8EB" />
				<rect x="17" y="79" width="66" height="9" rx="4.5" fill="#E6E8EB" />
			</svg>
			<h1>Vela</h1>
			<p>Sign in to your workspace</p>
		</div>

		<!--ERROR_SLOT-->

		<form method="POST" action="/login" autocomplete="on">
			<input type="hidden" name="next" value="<!--NEXT_SLOT-->">

			<div class="field">
				<label for="username">Username</label>
				<input id="username" name="username" type="text" autocomplete="username"
					placeholder="your username" required autofocus spellcheck="false"
					autocapitalize="none" autocorrect="off">
			</div>

			<div class="field">
				<label for="password">Password</label>
				<div class="pw-wrap">
					<input id="password" name="password" type="password" autocomplete="current-password"
						placeholder="••••••••••" required>
					<button class="pw-toggle" type="button" id="pw-toggle"
						aria-label="Show password" aria-pressed="false" tabindex="0">
						<svg id="eye" width="18" height="18" viewBox="0 0 24 24" fill="none"
							stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
							<path d="M1.8 12s3.8-7 10.2-7 10.2 7 10.2 7-3.8 7-10.2 7S1.8 12 1.8 12z" />
							<circle cx="12" cy="12" r="3" />
						</svg>
					</button>
				</div>
				<span class="caps" id="caps">Caps Lock is on</span>
			</div>

			<button type="submit" id="submit">Sign in</button>
		</form>

		<footer>
			<strong>Vela</strong> by Fixnooc · built on Code&nbsp;-&nbsp;OSS<br>
			Authorized access only.
		</footer>
	</main>

<script>
	(function () {
		var pw = document.getElementById('password');
		var toggle = document.getElementById('pw-toggle');
		var eye = document.getElementById('eye');
		var caps = document.getElementById('caps');
		var form = document.querySelector('form');
		var submit = document.getElementById('submit');

		var OPEN = '<path d="M1.8 12s3.8-7 10.2-7 10.2 7 10.2 7-3.8 7-10.2 7S1.8 12 1.8 12z"/><circle cx="12" cy="12" r="3"/>';
		var SHUT = '<path d="M3 3l18 18"/><path d="M10.6 5.2A10.9 10.9 0 0112 5c6.4 0 10.2 7 10.2 7a18.3 18.3 0 01-2.9 3.9M6.6 6.7A18.4 18.4 0 001.8 12s3.8 7 10.2 7a10.8 10.8 0 004.3-.86"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/>';

		toggle.addEventListener('click', function () {
			var show = pw.type === 'password';
			pw.type = show ? 'text' : 'password';
			eye.innerHTML = show ? SHUT : OPEN;
			toggle.setAttribute('aria-pressed', String(show));
			toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
			pw.focus();
		});

		function checkCaps(event) {
			if (typeof event.getModifierState !== 'function') { return; }
			caps.classList.toggle('on', event.getModifierState('CapsLock'));
		}

		pw.addEventListener('keydown', checkCaps);
		pw.addEventListener('keyup', checkCaps);

		form.addEventListener('submit', function () {
			submit.disabled = true;
			submit.textContent = 'Signing in…';
		});
	})();
</script>
</body>
</html>
